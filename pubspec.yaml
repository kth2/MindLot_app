name: mindlot
description: "萬通解籤 — AI-powered temple divination lot companion. Photograph a real lot, draw one virtually, and receive a warm, personalized interpretation."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0" # Flutter 3.32+ (RadioGroup)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Camera / gallery
  camera: ^0.11.0 # in-app live viewfinder with framing overlay
  image_picker: ^1.1.2 # gallery picker + system-camera fallback

  # Networking (Gemini REST API)
  http: ^1.2.2

  # Local persistence (settings, history, favorites)
  shared_preferences: ^2.3.3

  # Temple-style typography (Noto Serif TC)
  google_fonts: ^6.2.1

  # Shake sound effect
  audioplayers: ^6.1.0

  # Record ids
  uuid: ^4.5.1

  # Share a lot card as an image
  share_plus: ^10.1.4
  path_provider: ^2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Launcher-icon generator (run once locally after pulling):
  #   flutter pub get && dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# Generates the Android launcher icons from a single source image.
# (The launcher *label* lives in android/app/src/main/AndroidManifest.xml —
# set android:label="萬通解籤" there; that folder isn't tracked in this repo.)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false # only the android platform is generated locally so far
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#B3402A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/sounds/
